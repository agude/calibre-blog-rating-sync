# Every step calls a just recipe, so this file only changes when the shape of
# the pipeline changes — not when the tooling does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just sync

      - name: Lint
        run: just lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Calibre ships its own interpreter and still supports 3.8, so the
        # floor here is external rather than a choice.
        python-version: ["3.8", "3.10", "3.12"]
    name: Python ${{ matrix.python-version }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Test
        run: just test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build plugin zip
        run: just build

      - uses: actions/upload-artifact@v4
        with:
          name: BlogRatingSync
          path: plugin/*

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build plugin zip
        run: just build

      - uses: softprops/action-gh-release@v2
        with:
          files: BlogRatingSync.zip
