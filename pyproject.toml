[project]
name = "calibre-blog-rating-sync"
version = "0.4.0"
description = "Calibre plugin to sync book ratings from blog reviews via JSON-LD structured data"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pyqt6>=6.5",
    "pytest>=8.0",
    "ruff>=0.16",
    "zizmor>=1.30; python_version >= '3.10'",
]

[tool.uv]
# Ignore releases younger than a week, so a compromised upload has time to be
# noticed and yanked before it reaches the lock. Dependabot's cooldown matches.
exclude-newer = "7 days"
# Dependabot uses uv 0.12.18 to update the lock on Python 3.11.
# Use uv 0.13 or newer to download the final release of Python 3.15.
required-version = ">=0.12.18"

[tool.ruff]
# Calibre ships its own interpreter; keep the plugin runnable on the oldest
# version the CI matrix covers.
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/stubs"]
